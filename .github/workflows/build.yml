name: Build

on:
  push:
    branches: ["**"]
    paths:
      - "xemu-tools-rs/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "xemu-tools-rs/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: xemu-tools-rs
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
      XEMU_TOOLS_UPDATE_VERIFYING_KEY: ${{ vars.UPDATE_VERIFYING_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: xemu-tools-rs -> target
          shared-key: windows-stable
          key: build
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Test
        run: cargo test --locked --release --all-targets

      - name: Build release executable
        run: cargo build --locked --release

      - name: Share release executable
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xemu-tools-rs
          path: xemu-tools-rs/target/release/xemu-tools-rs.exe
          if-no-files-found: error
          retention-days: 1

  lint:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: xemu-tools-rs
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
      XEMU_TOOLS_UPDATE_VERIFYING_KEY: ${{ vars.UPDATE_VERIFYING_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: xemu-tools-rs -> target
          shared-key: windows-stable
          key: lint
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Lint
        run: cargo clippy --locked --all-targets
