name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: xemu-tools-rs
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
      XEMU_TOOLS_UPDATE_VERIFYING_KEY: ${{ vars.UPDATE_VERIFYING_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update

      - name: Test
        run: cargo test --locked --all-targets

      - name: Lint
        run: cargo clippy --locked --all-targets

      - name: Build release executable
        run: cargo build --locked --release

      - name: Share release executable
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xemu-tools-rs
          path: xemu-tools-rs/target/release/xemu-tools-rs.exe
          if-no-files-found: error
          retention-days: 1
